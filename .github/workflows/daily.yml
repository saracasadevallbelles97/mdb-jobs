# ---------------------------------------------------------------------------
# daily.yml — runs every morning and refreshes the list.
#
# GitHub Actions is a free computer that GitHub starts on a schedule, runs your
# commands on, then throws away. This is the entire "automatic" part of the
# project: no server to rent, nothing of yours that has to be switched on.
#
# This workflow only COLLECTS. The weekly newsletter is a separate file
# (weekly-digest.yml) so that the two jobs can fail independently — if the
# newsletter step breaks, your data still keeps updating.
# ---------------------------------------------------------------------------

name: Daily collection

on:
  schedule:
    # minute hour day-of-month month day-of-week — always UTC, never local time.
    # 05:30 UTC daily. An odd number is deliberate: GitHub queues thousands of
    # jobs on the hour, so off-peak minutes start sooner.
    - cron: "30 5 * * *"

  # Adds a "Run workflow" button in the Actions tab. This is how you test it
  # without waiting until tomorrow. Do not remove it.
  workflow_dispatch:

permissions:
  contents: write        # needed to commit the refreshed data back

# If yesterday's run somehow hasn't finished, don't start a second one on top.
concurrency:
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect jobs
        run: python scripts/fetch.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json docs/jobs.csv
          # `git diff --staged --quiet` succeeds when nothing changed. Without
          # this guard the step fails on a quiet day, which would fill your
          # inbox with false alarms and teach you to ignore real ones.
          if git diff --staged --quiet; then
            echo "Nothing new today."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
